# ==============================================================================
# Configuración de Pytest y Pytest-Qt para Blar Plus
# ==============================================================================
[pytest]
# Agrega la raíz del proyecto al PYTHONPATH para importar las 4 capas sin errores
pythonpath = .

# Limita la búsqueda de pruebas únicamente a la carpeta tests
testpaths = tests

# Vincula explícitamente pytest-qt con PySide6
qt_api = pyside6

# Muestra cada prueba individualmente (-v) y trazas de error compactas (--tb=short)
addopts = -v --tb=short
